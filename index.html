<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05050b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%234ff0ff'/%3E%3Ccircle cx='11' cy='11' r='4' fill='white'/%3E%3C/svg%3E">
<title>NEON ROLL</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#05050b;overscroll-behavior:none}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
    color:#e9ecff;user-select:none;-webkit-user-select:none;touch-action:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;background:#05050b;touch-action:none}
  .hidden{display:none !important}

  #hud{
    position:fixed;inset:0;pointer-events:none;
    padding:calc(14px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 0 calc(18px + env(safe-area-inset-left));
    display:flex;justify-content:space-between;align-items:flex-start;
  }
  .stat{display:flex;flex-direction:column;gap:2px;text-shadow:0 0 18px rgba(90,200,255,.5)}
  .stat .lbl{font-size:10px;letter-spacing:.22em;font-weight:800;color:#7d8bb5}
  .stat b{font-size:clamp(22px,5vw,34px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .stat.right{align-items:flex-end}
  #time.low{color:#ff5f7a;text-shadow:0 0 22px rgba(255,60,100,.7)}
  #combo{
    position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top));
    transform:translateX(-50%) scale(.8);opacity:0;transition:opacity .18s,transform .18s;
    font-size:clamp(18px,4.5vw,26px);font-weight:900;letter-spacing:.04em;
    color:#ffd166;text-shadow:0 0 24px rgba(255,180,60,.8);white-space:nowrap;
  }
  #combo.on{opacity:1;transform:translateX(-50%) scale(1)}

  .overlay{
    position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:20px;
    background:radial-gradient(120% 90% at 50% 40%,rgba(12,10,34,.62),rgba(4,4,10,.9));
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  }
  .card{
    width:min(380px,92vw);text-align:center;
    padding:28px 24px calc(24px + env(safe-area-inset-bottom));
    border-radius:26px;border:1px solid rgba(120,160,255,.22);
    background:linear-gradient(160deg,rgba(26,24,60,.9),rgba(8,8,20,.95));
    box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07);
  }
  h1{font-size:clamp(36px,12vw,50px);line-height:.92;letter-spacing:-.03em;font-weight:900;margin-bottom:10px}
  h1 span{display:block;background:linear-gradient(90deg,#4ff0ff,#b46bff 55%,#ff5fa2);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(120,120,255,.55))}
  .tag{color:#a6b0d8;font-size:14px;line-height:1.5;margin-bottom:16px}
  .tag b{color:#e9ecff}
  .best{font-size:12px;letter-spacing:.18em;font-weight:800;color:#7d8bb5;margin-bottom:18px}
  .best b{color:#4ff0ff;font-size:16px;letter-spacing:0;margin-left:6px}
  button{
    display:block;width:100%;border:0;color:#e9ecff;font:inherit;font-weight:800;
    border-radius:16px;padding:16px;font-size:16px;cursor:pointer;touch-action:manipulation;
    transition:transform .08s ease,filter .15s ease;
  }
  button:active{transform:scale(.97)}
  .primary{
    background:linear-gradient(100deg,#2fd7ff,#8b5cff 55%,#ff5fa2);
    color:#070714;font-size:18px;letter-spacing:.04em;
    box-shadow:0 10px 34px rgba(100,90,255,.5),inset 0 1px 0 rgba(255,255,255,.4);
  }
  .ghost{
    margin-bottom:10px;background:rgba(90,110,200,.13);border:1px solid rgba(130,160,255,.3);
    color:#c3cdf5;font-size:14px;padding:14px;
  }
  .ghost.on{background:rgba(80,240,255,.14);border-color:rgba(80,240,255,.6);color:#8ff6ff;box-shadow:0 0 26px rgba(80,240,255,.22)}
  .ghost small{display:block;font-weight:600;color:#7d8bb5;margin-top:4px;font-size:11px;letter-spacing:.02em}
  .hint{min-height:16px;margin-top:14px;font-size:12px;color:#8b96c0;line-height:1.4}
  .hint.warn{color:#ffb35c}
  .final{display:flex;justify-content:center;gap:28px;margin:4px 0 20px}
  .final div{display:flex;flex-direction:column;gap:4px}
  .final span{font-size:10px;letter-spacing:.2em;font-weight:800;color:#7d8bb5}
  .final b{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
  #over .final b:first-child{color:#4ff0ff;text-shadow:0 0 26px rgba(80,240,255,.5)}
  .link{margin-top:12px;background:none;border:0;color:#8b96c0;font-size:13px;font-weight:600;padding:10px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="stat"><span class="lbl">SCORE</span><b id="score">0</b></div>
  <div id="combo">x1</div>
  <div class="stat right"><span class="lbl">TIME</span><b id="time">45</b></div>
</div>

<div id="menu" class="overlay">
  <div class="card">
    <h1>NEON<span>ROLL</span></h1>
    <p class="tag"><b>기울이거나 드래그</b>해서 오브를 모으세요.<br>연속으로 먹으면 콤보 배수!</p>
    <div class="best">BEST <b id="bestMenu">0</b></div>
    <button id="tiltBtn" class="ghost">
      <span id="tiltLabel">틸트: 꺼짐 (터치)</span>
      <small>선택 · 아이폰은 권한 요청이 떠요</small>
    </button>
    <button id="playBtn" class="primary">PLAY</button>
    <p class="hint" id="menuHint">45초 · 오브 1개 = 10점 × 콤보</p>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="card">
    <h1>TIME<span>UP</span></h1>
    <p class="tag" id="overTag">수고했어요!</p>
    <div class="final">
      <div><span>SCORE</span><b id="finalScore">0</b></div>
      <div><span>BEST</span><b id="finalBest">0</b></div>
    </div>
    <button id="againBtn" class="primary">다시 도전</button>
    <button id="menuBtn" class="link">메뉴로</button>
  </div>
</div>

<script>
(() => {
'use strict';

// ---------- utils ----------
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);

const cvs = $('c');
const ctx = cvs.getContext('2d', { alpha: false });
const scoreEl = $('score'), timeEl = $('time'), comboEl = $('combo');
const hud = $('hud'), menu = $('menu'), over = $('over');
const bestMenu = $('bestMenu'), finalScore = $('finalScore'), finalBest = $('finalBest');

let W = 0, H = 0, DPR = 1;
const GAME_TIME = 45;
const START_ORBS = 6;
const MAX_TRAIL = 15;

const S = {
  mode: 'menu',
  score: 0,
  best: Number(localStorage.getItem('neonroll.best')) || 0,
  time: GAME_TIME,
  combo: 1,
  comboTimer: 0,
  ball: { x: 0, y: 0, vx: 0, vy: 0, r: 15 },
  orbs: [],
  obstacles: [],
  particles: [],
  trail: [],
  clock: 0
};

// ---------- audio ----------
let ac = null;
function audio() {
  if (!ac) {
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
  }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(freq, dur, type = 'sine', vol = 0.07) {
  const a = audio();
  if (!a) return;
  const t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq * 1.06, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

// ---------- resize ----------
let lastW = 0;
function resize() {
  const nw = window.innerWidth, nh = window.innerHeight;
  if (!nw || !nh) return;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = nw; H = nh;
  cvs.width = Math.round(W * DPR);
  cvs.height = Math.round(H * DPR);
  cvs.style.width = W + 'px';
  cvs.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const bigShift = lastW && Math.abs(W - lastW) > 120;
  lastW = W;
  if (S.mode === 'playing') {
    if (bigShift) {
      S.obstacles = makeObstacles();
      S.orbs = [];
      for (let i = 0; i < START_ORBS; i++) spawnOrb();
      S.ball.x = W / 2; S.ball.y = H / 2;
      S.ball.vx = S.ball.vy = 0;
    }
    clampBall();
  } else if (S.mode === 'menu') {
    buildScene();
  }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

// ---------- scene ----------
function makeObstacles() {
  const arr = [];
  const n = clamp(Math.round(W * H / 110000), 4, 9);
  for (let t = 0; t < 500 && arr.length < n; t++) {
    const r = rand(24, 58);
    const x = rand(30 + r, W - 30 - r);
    const y = rand(80 + r, H - 60 - r);
    if (Math.hypot(x - W / 2, y - H / 2) < 135 + r) continue;
    if (arr.some(o => Math.hypot(o.x - x, o.y - y) < o.r + r + 46)) continue;
    arr.push({ x, y, r, hue: rand(240, 300), spin: rand(0, TAU) });
  }
  return arr;
}

function spawnOrb() {
  const b = S.ball;
  for (let t = 0; t < 80; t++) {
    const r = 10;
    const x = rand(26 + r, Math.max(27 + r, W - 26 - r));
    const y = rand(76 + r, Math.max(77 + r, H - 52 - r));
    if (Math.hypot(x - b.x, y - b.y) < 85) continue;
    if (S.obstacles.some(o => Math.hypot(o.x - x, o.y - y) < o.r + r + 16)) continue;
    if (S.orbs.some(o => Math.hypot(o.x - x, o.y - y) < 66)) continue;
    S.orbs.push({ x, y, r, phase: rand(0, TAU), hue: [186, 265, 322, 145, 45][Math.floor(Math.random() * 5)] });
    return true;
  }
  return false;
}

function buildScene() {
  S.ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, r: 15 };
  S.obstacles = makeObstacles();
  S.orbs = [];
  S.particles = [];
  S.trail = [];
  for (let i = 0; i < START_ORBS; i++) spawnOrb();
}

function resetGame() {
  S.score = 0;
  S.time = GAME_TIME;
  S.combo = 1;
  S.comboTimer = 0;
  buildScene();
  updateHUD();
}

function clampBall() {
  const b = S.ball;
  b.x = clamp(b.x, b.r, W - b.r);
  b.y = clamp(b.y, 66 + b.r, H - b.r);
}

// ---------- input ----------
const keys = { x: 0, y: 0 };
const keyState = Object.create(null);

function keyVec() {
  let x = 0, y = 0;
  if (keyState['ArrowLeft'] || keyState['a'] || keyState['A']) x -= 1;
  if (keyState['ArrowRight'] || keyState['d'] || keyState['D']) x += 1;
  if (keyState['ArrowUp'] || keyState['w'] || keyState['W']) y -= 1;
  if (keyState['ArrowDown'] || keyState['s'] || keyState['S']) y += 1;
  keys.x = x; keys.y = y;
}
window.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  keyState[e.key] = true; keyVec();
});
window.addEventListener('keyup', e => { keyState[e.key] = false; keyVec(); });
window.addEventListener('blur', () => { for (const k in keyState) keyState[k] = false; keyVec(); });

const joy = { active: false, id: null, ox: 0, oy: 0, dx: 0, dy: 0 };
const JOY_RADIUS = 58;

cvs.addEventListener('pointerdown', e => {
  if (S.mode !== 'playing') return;
  if (joy.active) return;
  e.preventDefault();
  joy.active = true;
  joy.id = e.pointerId;
  joy.ox = e.clientX;
  joy.oy = e.clientY;
  joy.dx = 0; joy.dy = 0;
  try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
});

cvs.addEventListener('pointermove', e => {
  if (!joy.active || e.pointerId !== joy.id) return;
  e.preventDefault();
  let dx = (e.clientX - joy.ox) / JOY_RADIUS;
  let dy = (e.clientY - joy.oy) / JOY_RADIUS;
  const m = Math.hypot(dx, dy);
  if (m > 1) { dx /= m; dy /= m; }
  joy.dx = dx; joy.dy = dy;
});

function endPointer(e) {
  if (!joy.active || e.pointerId !== joy.id) return;
  joy.active = false;
  joy.id = null;
  joy.dx = 0; joy.dy = 0;
}
cvs.addEventListener('pointerup', endPointer);
cvs.addEventListener('pointercancel', endPointer);
cvs.addEventListener('contextmenu', e => e.preventDefault());

// ---------- tilt ----------
let useTilt = false;
let tiltHandled = false;
let tiltRawX = 0, tiltRawY = 0;
let tiltX = 0, tiltY = 0;
let tiltBase = null;
let lastOrientAt = 0;

function onOrientation(e) {
  if (e.gamma == null && e.beta == null) return;
  lastOrientAt = performance.now();
  const g = e.gamma || 0, b = e.beta || 0;
  if (!tiltBase) { tiltBase = { g, b }; return; }
  let dg = g - tiltBase.g;
  let db = b - tiltBase.b;
  // handle wrap-around
  if (dg > 180) dg -= 360; if (dg < -180) dg += 360;

  let x = dg / 17;
  let y = db / 17;

  // account for landscape rotation
  const angle = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  if (angle === 90) { const nx = y, ny = -x; x = nx; y = ny; }
  else if (angle === -90 || angle === 270) { const nx = -y, ny = x; x = nx; y = ny; }

  tiltRawX = clamp(x, -1, 1);
  tiltRawY = clamp(y, -1, 1);
}

function setTilt(on) {
  useTilt = on;
  const btn = $('tiltBtn');
  const label = $('tiltLabel');
  if (on) {
    btn.classList.add('on');
    label.textContent = '틸트: 켜짐';
    tiltBase = null;
    tiltX = tiltY = 0;
    tiltRawX = tiltRawY = 0;
    lastOrientAt = performance.now();
  } else {
    btn.classList.remove('on');
    label.textContent = '틸트: 꺼짐 (터치)';
    tiltX = tiltY = 0;
    tiltRawX = tiltRawY = 0;
  }
}

async function enableTilt() {
  if (typeof DeviceOrientationEvent === 'undefined') {
    hint('이 브라우저는 틸트를 지원하지 않아요. 터치로 플레이!', true);
    return;
  }
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    let res = 'denied';
    try { res = await DeviceOrientationEvent.requestPermission(); } catch (err) { res = 'denied'; }
    if (res !== 'granted') {
      hint('모션 권한이 거부됐어요. 터치로 플레이!', true);
      return;
    }
  }
  if (!tiltHandled) {
    window.addEventListener('deviceorientation', onOrientation, true);
    tiltHandled = true;
  }
  setTilt(true);
  hint('틸트 켜짐 · 지금 잡은 자세가 기준이에요', false);
  setTimeout(() => {
    if (useTilt && performance.now() - lastOrientAt > 1200) {
      hint('틸트 신호가 없어요. 터치로 플레이!', true);
      setTilt(false);
    }
  }, 1400);
}

function toggleTilt() {
  if (useTilt) {
    setTilt(false);
    hint('틸트 꺼짐 · 드래그로 플레이', false);
  } else {
    enableTilt();
  }
}

function hint(msg, warn) {
  const el = $('menuHint');
  el.textContent = msg;
  el.className = 'hint' + (warn ? ' warn' : '');
}

// ---------- game loop ----------
let last = performance.now();

function update(dt) {
  S.clock += dt;
  S.time -= dt;
  if (S.time <= 0) { S.time = 0; updateHUD(); gameOver(); return; }

  // input vector
  let ix = 0, iy = 0;
  if (joy.active) { ix = joy.dx; iy = joy.dy; }
  else if (useTilt) { ix = tiltX; iy = tiltY; }
  ix += keys.x; iy += keys.y;
  const im = Math.hypot(ix, iy);
  if (im > 1) { ix /= im; iy /= im; }

  const b = S.ball;
  b.vx += ix * 1950 * dt;
  b.vy += iy * 1950 * dt;
  const fr = Math.exp(-2.5 * dt);
  b.vx *= fr; b.vy *= fr;
  const sp = Math.hypot(b.vx, b.vy);
  if (sp > 980) { b.vx *= 980 / sp; b.vy *= 980 / sp; }
  b.x += b.vx * dt;
  b.y += b.vy * dt;

  // walls (top margin keeps the ball out of the HUD)
  const TOP = 66;
  if (b.x < b.r) { b.x = b.r; if (b.vx < 0) b.vx = -b.vx * 0.55; }
  if (b.x > W - b.r) { b.x = W - b.r; if (b.vx > 0) b.vx = -b.vx * 0.55; }
  if (b.y < TOP + b.r) { b.y = TOP + b.r; if (b.vy < 0) b.vy = -b.vy * 0.55; }
  if (b.y > H - b.r) { b.y = H - b.r; if (b.vy > 0) b.vy = -b.vy * 0.55; }

  // obstacles
  for (const o of S.obstacles) {
    const dx = b.x - o.x, dy = b.y - o.y;
    const d = Math.hypot(dx, dy);
    const min = b.r + o.r;
    if (d < min && d > 0.0001) {
      const nx = dx / d, ny = dy / d;
      b.x = o.x + nx * min;
      b.y = o.y + ny * min;
      const vn = b.vx * nx + b.vy * ny;
      if (vn < 0) {
        b.vx -= 1.55 * vn * nx;
        b.vy -= 1.55 * vn * ny;
        b.vx *= 0.92; b.vy *= 0.92;
        if (-vn > 220) burst(b.x - nx * b.r, b.y - ny * b.r, o.hue, 4, 120);
      }
    }
  }

  // trail
  S.trail.push({ x: b.x, y: b.y });
  if (S.trail.length > MAX_TRAIL) S.trail.shift();

  // orbs
  for (let i = S.orbs.length - 1; i >= 0; i--) {
    const o = S.orbs[i];
    if (Math.hypot(b.x - o.x, b.y - o.y) < b.r + o.r + 5) {
      S.orbs.splice(i, 1);
      S.score += 10 * S.combo;
      S.combo = Math.min(9, S.combo + 1);
      S.comboTimer = 2.1;
      burst(o.x, o.y, o.hue, 16, 260);
      tone(420 + S.combo * 55, 0.1, 'triangle', 0.06);
      if (navigator.vibrate) navigator.vibrate(8);
      spawnOrb();
    }
  }
  let guard = 0;
  while (S.orbs.length < START_ORBS && guard++ < 8) { if (!spawnOrb()) break; }

  // combo decay
  if (S.combo > 1) {
    S.comboTimer -= dt;
    if (S.comboTimer <= 0) { S.combo = 1; }
  }

  // particles
  for (let i = S.particles.length - 1; i >= 0; i--) {
    const p = S.particles[i];
    p.life -= dt;
    if (p.life <= 0) { S.particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    const f = Math.exp(-3.2 * dt);
    p.vx *= f; p.vy *= f;
  }

  // tilt smoothing
  tiltX += (tiltRawX - tiltX) * Math.min(1, dt * 9);
  tiltY += (tiltRawY - tiltY) * Math.min(1, dt * 9);

  updateHUD();
}

function burst(x, y, hue, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(speed * 0.25, speed);
    S.particles.push({
      x, y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(0.35, 0.8), max: 0.8,
      size: rand(1.5, 3.6), hue
    });
  }
}

let hudScore = -1, hudTime = -1, hudCombo = -1;
function updateHUD() {
  if (S.score !== hudScore) { hudScore = S.score; scoreEl.textContent = S.score; }
  const t = Math.ceil(S.time);
  if (t !== hudTime) {
    hudTime = t;
    timeEl.textContent = t;
    timeEl.classList.toggle('low', t <= 10);
  }
  if (S.combo !== hudCombo) {
    hudCombo = S.combo;
    comboEl.textContent = 'x' + S.combo;
    comboEl.classList.toggle('on', S.combo > 1);
  }
}

// ---------- drawing ----------
function draw(now) {
  const b = S.ball;

  // background
  ctx.fillStyle = '#05050b';
  ctx.fillRect(0, 0, W, H);

  const bg = ctx.createRadialGradient(W / 2, H * 0.42, 0, W / 2, H * 0.42, Math.max(W, H) * 0.75);
  bg.addColorStop(0, 'rgba(58,42,140,0.30)');
  bg.addColorStop(0.55, 'rgba(24,18,60,0.12)');
  bg.addColorStop(1, 'rgba(5,5,11,0)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // grid
  ctx.strokeStyle = 'rgba(120,140,255,0.055)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  const cell = 46;
  for (let x = (W % cell) / 2; x < W; x += cell) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = (H % cell) / 2; y < H; y += cell) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  // obstacles
  for (const o of S.obstacles) {
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, 0, TAU);
    ctx.fillStyle = 'rgba(14,15,36,0.96)';
    ctx.fill();
    ctx.strokeStyle = `hsla(${o.hue},90%,70%,0.45)`;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r * 0.56, 0, TAU);
    ctx.strokeStyle = `hsla(${o.hue},90%,70%,0.16)`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // orbs
  for (const o of S.orbs) {
    const pulse = 1 + 0.16 * Math.sin(now * 4 + o.phase);
    const col = `hsl(${o.hue} 100% 65%)`;
    const glow = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r * 3.4);
    glow.addColorStop(0, `hsla(${o.hue},100%,70%,0.42)`);
    glow.addColorStop(1, `hsla(${o.hue},100%,70%,0)`);
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r * 3.4, 0, TAU);
    ctx.fill();

    ctx.save();
    ctx.shadowColor = col;
    ctx.shadowBlur = 16;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r * pulse, 0, TAU);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(o.x - o.r * 0.28, o.y - o.r * 0.28, o.r * 0.26 * pulse, 0, TAU);
    ctx.fill();
  }

  // particles
  for (const p of S.particles) {
    const a = Math.max(0, p.life / p.max);
    ctx.fillStyle = `hsla(${p.hue},100%,70%,${a * 0.9})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * a + 0.4, 0, TAU);
    ctx.fill();
  }

  // trail
  if (S.trail.length > 1) {
    for (let i = 0; i < S.trail.length; i++) {
      const p = S.trail[i];
      const a = (i + 1) / S.trail.length;
      ctx.fillStyle = `rgba(80,230,255,${a * 0.16})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, b.r * (0.25 + a * 0.7), 0, TAU);
      ctx.fill();
    }
  }

  // ball
  const bg2 = ctx.createRadialGradient(b.x - b.r * 0.35, b.y - b.r * 0.4, b.r * 0.15, b.x, b.y, b.r);
  bg2.addColorStop(0, '#ffffff');
  bg2.addColorStop(0.35, '#9ef7ff');
  bg2.addColorStop(1, '#2bb9ff');
  ctx.save();
  ctx.shadowColor = 'rgba(90,230,255,0.9)';
  ctx.shadowBlur = 26;
  ctx.fillStyle = bg2;
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r, 0, TAU);
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle = 'rgba(255,255,255,0.65)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r - 0.8, 0, TAU);
  ctx.stroke();

  // joystick
  if (joy.active) {
    ctx.strokeStyle = 'rgba(150,220,255,0.25)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(joy.ox, joy.oy, JOY_RADIUS, 0, TAU);
    ctx.stroke();
    ctx.fillStyle = 'rgba(120,210,255,0.10)';
    ctx.fill();
    ctx.fillStyle = 'rgba(140,230,255,0.55)';
    ctx.beginPath();
    ctx.arc(joy.ox + joy.dx * JOY_RADIUS, joy.oy + joy.dy * JOY_RADIUS, 19, 0, TAU);
    ctx.fill();
  }

  // vignette
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (S.mode === 'playing') update(dt);
  else S.clock += dt;
  draw(now / 1000);
  requestAnimationFrame(frame);
}

// ---------- flow ----------
function startGame() {
  audio();
  resetGame();
  menu.classList.add('hidden');
  over.classList.add('hidden');
  hud.classList.remove('hidden');
  S.mode = 'playing';
  last = performance.now();
  if (useTilt) { tiltBase = null; tiltX = tiltY = 0; }
}

function gameOver() {
  S.mode = 'over';
  tone(300, 0.25, 'sawtooth', 0.05);
  setTimeout(() => tone(190, 0.4, 'sine', 0.05), 150);
  if (S.score > S.best) {
    S.best = S.score;
    localStorage.setItem('neonroll.best', String(S.best));
  }
  bestMenu.textContent = S.best;
  finalScore.textContent = S.score;
  finalBest.textContent = S.best;
  $('overTag').innerHTML = S.score >= S.best && S.score > 0
    ? '🎉 <b>신기록!</b>'
    : 'BEST까지 <b>' + Math.max(0, S.best - S.score) + '점</b> 남았어요';
  hud.classList.add('hidden');
  over.classList.remove('hidden');
  joy.active = false;
}

function openMenu() {
  S.mode = 'menu';
  buildScene();
  over.classList.add('hidden');
  hud.classList.add('hidden');
  menu.classList.remove('hidden');
  bestMenu.textContent = S.best;
  hint('45초 · 오브 1개 = 10점 × 콤보', false);
}

$('playBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('menuBtn').addEventListener('click', openMenu);
$('tiltBtn').addEventListener('click', toggleTilt);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) last = performance.now();
});

// ---------- boot ----------
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  // no offline worker; keep it simple
}
bestMenu.textContent = S.best;
resize();
buildScene();
requestAnimationFrame(frame);
})();
</script>
</body>
